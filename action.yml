name: 'Uncut Gemini'
description: 'AI code review + dependency scanning + PR hygiene — one action, full picture'

inputs:
  google-api-key:
    description: 'Google AI API key for Gemini'
    required: true
  model:
    description: 'Gemini model to use'
    required: false
    default: 'gemini-2.5-pro'
  guidelines-file:
    description: 'Path to repo-specific review guidelines (markdown)'
    required: false
    default: '.github/review-guidelines.md'
  min-severity:
    description: 'Minimum review severity to report (HIGH, MEDIUM, NIT)'
    required: false
    default: 'MEDIUM'
  extra-instructions:
    description: 'Additional instructions appended to the review prompt'
    required: false
    default: ''
  custom-prompt:
    description: 'Full replacement prompt. Use {diff}, {guidelines}, {schema} placeholders.'
    required: false
    default: ''
  trivy:
    description: 'Run Trivy dependency scan (true/false)'
    required: false
    default: 'true'
  trivy-severity:
    description: 'Trivy severity threshold (comma-separated)'
    required: false
    default: 'CRITICAL,HIGH'
  trivy-block-on:
    description: 'Block merge if vulnerabilities at this level exist (CRITICAL, HIGH, or NONE to never block)'
    required: false
    default: 'CRITICAL'
  size-warning:
    description: 'Warn when PR exceeds this many changed lines (0 to disable)'
    required: false
    default: '500'
  pr-number:
    description: 'PR number to review (auto-detected from pull_request event if omitted)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # ── Resolve PR context ────────────────────────────────────────
    - name: Resolve PR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        PR_NUMBER="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
        if [ -z "$PR_NUMBER" ]; then
          PR_NUMBER=$(gh pr view --json number --jq '.number' 2>/dev/null || true)
        fi
        if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "::error::No valid PR number — pass pr-number input or trigger from a pull_request event"
          exit 1
        fi
        HEAD_SHA="${EVENT_HEAD_SHA}"
        if [ -z "$HEAD_SHA" ]; then
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
        fi
        if [ -z "$HEAD_SHA" ]; then
          echo "::error::Could not resolve HEAD SHA for PR #${PR_NUMBER}"
          exit 1
        fi
        echo "UG_PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
        echo "UG_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
        echo "Reviewing PR #${PR_NUMBER} at ${HEAD_SHA:0:7}"

    # ── Checkout PR head ──────────────────────────────────────────
    - name: Checkout PR head
      uses: actions/checkout@v4
      with:
        ref: ${{ env.UG_HEAD_SHA }}
        persist-credentials: false

    # ── Trivy dependency scan ──────────────────────────────────────
    - name: Trivy scan
      if: inputs.trivy == 'true'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: ${{ inputs.trivy-severity }}
        exit-code: '0'
        format: 'json'
        output: 'trivy-results.json'

    - name: Trivy results
      if: inputs.trivy == 'true'
      shell: bash
      env:
        BLOCK_ON: ${{ inputs.trivy-block-on }}
      run: |
        if [ ! -f trivy-results.json ]; then
          echo "::warning::Trivy scan produced no output"
          exit 0
        fi

        CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
        HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)

        # Step summary
        {
          echo "## Dependency Scan"
          echo ""
          if [ "$CRITICAL" -eq 0 ] && [ "$HIGH" -eq 0 ]; then
            echo "No HIGH or CRITICAL vulnerabilities found."
          else
            echo "| Severity | Package | Installed | Fixed | CVE |"
            echo "|----------|---------|-----------|-------|-----|"
            jq -r '
              [.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")]
              | sort_by(.Severity)
              | .[]
              | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") | \(.VulnerabilityID) |"
            ' trivy-results.json
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # Review fragment for unified comment
        if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
          {
            echo "### 🛡️ Dependencies — ${CRITICAL} critical, ${HIGH} high"
            echo ""
            echo "| Severity | Package | Installed | Fixed | CVE |"
            echo "|----------|---------|-----------|-------|-----|"
            jq -r '
              [.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")]
              | sort_by(.Severity)
              | .[]
              | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") | \(.VulnerabilityID) |"
            ' trivy-results.json
          } > /tmp/trivy-fragment.md
        else
          echo "### 🛡️ Dependencies — clean" > /tmp/trivy-fragment.md
        fi

        if [ "$BLOCK_ON" = "CRITICAL" ] && [ "$CRITICAL" -gt 0 ]; then
          echo "::error::Found $CRITICAL CRITICAL vulnerabilities — merge blocked"
          echo "UG_TRIVY_BLOCKED=true" >> "$GITHUB_ENV"
        elif [ "$BLOCK_ON" = "HIGH" ] && [ "$((CRITICAL + HIGH))" -gt 0 ]; then
          echo "::error::Found $CRITICAL critical + $HIGH high vulnerabilities — merge blocked"
          echo "UG_TRIVY_BLOCKED=true" >> "$GITHUB_ENV"
        fi

        if [ "$HIGH" -gt 0 ]; then
          echo "::warning::Found $HIGH HIGH vulnerabilities"
        fi

    # ── PR size + dependency diff ──────────────────────────────────
    - name: PR stats
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ env.UG_PR_NUMBER }}
        SIZE_THRESHOLD: ${{ inputs.size-warning }}
      run: |
        # PR size
        PR_JSON=$(gh pr view "$PR_NUMBER" --json additions,deletions,changedFiles 2>/dev/null || echo '{}')
        ADDITIONS=$(echo "$PR_JSON" | jq '.additions // 0')
        DELETIONS=$(echo "$PR_JSON" | jq '.deletions // 0')
        FILES=$(echo "$PR_JSON" | jq '.changedFiles // 0')
        TOTAL=$((ADDITIONS + DELETIONS))

        if [ "$SIZE_THRESHOLD" -gt 0 ] && [ "$TOTAL" -gt "$SIZE_THRESHOLD" ]; then
          echo "### ⚠️ PR Size — ${TOTAL} lines changed across ${FILES} files" > /tmp/size-fragment.md
          echo "" >> /tmp/size-fragment.md
          echo "PRs over ${SIZE_THRESHOLD} lines are harder to review thoroughly. Consider splitting into smaller PRs." >> /tmp/size-fragment.md
          echo "::warning::Large PR: ${TOTAL} lines changed across ${FILES} files"
        else
          echo "### 📏 Size — ${TOTAL} lines across ${FILES} files" > /tmp/size-fragment.md
        fi

        # Dependency diff (lockfile changes)
        LOCKFILES="package-lock.json yarn.lock pnpm-lock.yaml go.sum requirements.txt Pipfile.lock poetry.lock Gemfile.lock Cargo.lock"
        CHANGED_LOCKS=""
        DIFF_TEXT=$(gh pr diff "$PR_NUMBER" 2>/dev/null || true)

        for lockfile in $LOCKFILES; do
          if echo "$DIFF_TEXT" | grep -q "^diff --git a/$lockfile b/$lockfile"; then
            CHANGED_LOCKS="$CHANGED_LOCKS $lockfile"
          fi
        done

        if [ -n "$CHANGED_LOCKS" ]; then
          {
            echo "### 📦 Dependencies Changed"
            echo ""
            for lockfile in $CHANGED_LOCKS; do
              echo "**${lockfile}:**"
              # Extract added/removed packages from diff
              ADDED=$(echo "$DIFF_TEXT" | sed -n "/^diff --git a\/${lockfile//\//\\/}/,/^diff --git/p" | grep '^+' | grep -v '^+++' || true)
              REMOVED=$(echo "$DIFF_TEXT" | sed -n "/^diff --git a\/${lockfile//\//\\/}/,/^diff --git/p" | grep '^-' | grep -v '^---' || true)
              ADD_COUNT=$(echo "$ADDED" | grep -c '.' || true)
              REM_COUNT=$(echo "$REMOVED" | grep -c '.' || true)
              echo "  +${ADD_COUNT} / -${REM_COUNT} lines"
              echo ""
            done
          } > /tmp/deps-fragment.md
        fi

    # ── Gemini code review ─────────────────────────────────────────
    - name: Detect review scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ env.UG_PR_NUMBER }}
        CURRENT_SHA: ${{ env.UG_HEAD_SHA }}
      run: |
        LAST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
          --jq '[.[] | select(.user.login == "github-actions[bot]")] | sort_by(.submitted_at) | last | .commit_id // empty' 2>/dev/null || true)

        if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
          echo "Already reviewed at $CURRENT_SHA — skipping"
          echo "SKIP_REVIEW=true" >> "$GITHUB_ENV"
        elif [ -n "$LAST_SHA" ]; then
          echo "Incremental review: $LAST_SHA → $CURRENT_SHA"
          echo "INCREMENTAL=true" >> "$GITHUB_ENV"
          echo "LAST_REVIEWED_SHA=$LAST_SHA" >> "$GITHUB_ENV"
        else
          echo "First review for this PR"
          echo "INCREMENTAL=false" >> "$GITHUB_ENV"
        fi

    - name: Get PR diff
      if: env.SKIP_REVIEW != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ env.UG_PR_NUMBER }}
      run: |
        if [ "$INCREMENTAL" = "true" ]; then
          CURRENT_SHA="${{ env.UG_HEAD_SHA }}"
          gh api "repos/$GITHUB_REPOSITORY/compare/${LAST_REVIEWED_SHA}...${CURRENT_SHA}" \
            --jq '.files[] | "diff --git a/\(.filename) b/\(.filename)\n\(.patch // "")"' \
            > /tmp/pr.diff 2>/dev/null || true
        fi

        if [ ! -s /tmp/pr.diff ]; then
          gh pr diff "$PR_NUMBER" > /tmp/pr.diff
          echo "INCREMENTAL=false" >> "$GITHUB_ENV"
        fi

        if [ ! -s /tmp/pr.diff ]; then
          echo "Empty diff — skipping review"
          echo "SKIP_REVIEW=true" >> "$GITHUB_ENV"
        fi

    - name: Run Gemini review
      if: env.SKIP_REVIEW != 'true'
      shell: bash
      continue-on-error: true
      env:
        GOOGLE_API_KEY: ${{ inputs.google-api-key }}
        GEMINI_MODEL: ${{ inputs.model }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        GUIDELINES_FILE: ${{ inputs.guidelines-file }}
        EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        CUSTOM_PROMPT: ${{ inputs.custom-prompt }}
      run: |
        if [ -f "$GUIDELINES_FILE" ]; then
          export REVIEW_GUIDELINES="$(cat "$GUIDELINES_FILE")"
        fi
        python3 ${{ github.action_path }}/review.py

    - name: Post review
      if: always() && env.SKIP_REVIEW != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ env.UG_PR_NUMBER }}
      run: |
        if [ -f /tmp/review-summary.md ]; then
          cat /tmp/review-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f /tmp/review-payload.json ]; then
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --method POST \
            --input /tmp/review-payload.json
        fi

    # ── Fail job if Trivy blocked merge ────────────────────────────
    - name: Block merge
      if: always() && env.UG_TRIVY_BLOCKED == 'true'
      shell: bash
      run: |
        echo "::error::Trivy found vulnerabilities that block merge — see review comment for details"
        exit 1
