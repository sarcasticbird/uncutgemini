# .github/workflows/review.yml
# One line — gets you Gemini code review + Trivy dependency scanning.
# Requires: GOOGLE_API_KEY set as a repository secret.
name: Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sarcasticbird/uncutgemini@v1
        with:
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
