# .github/workflows/review.yml
# Gemini review only — Trivy disabled (e.g., if you already run it separately).
name: Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sarcasticbird/uncutgemini@v1
        with:
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          trivy: 'false'
