# .github/workflows/review.yml
# Customized: stricter Trivy blocking, NIT-level review findings,
# extra prompt instructions, and a specific Gemini model.
name: Code Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to review'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sarcasticbird/uncutgemini@v1
        with:
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          model: 'gemini-2.5-flash'
          min-severity: 'NIT'
          trivy-block-on: 'HIGH'
          size-warning: '800'
          extra-instructions: 'Focus on SQL injection and auth bypass. Ignore CSS and test files.'
          pr-number: ${{ github.event.inputs.pr-number }}
